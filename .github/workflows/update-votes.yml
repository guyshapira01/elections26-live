name: Update election CSV
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: election-csv-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and validate election CSV
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, io, pathlib, urllib.request
          url='https://media26.bechirot.gov.il/files/expc.csv'
          request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/csv,*/*','Cache-Control':'no-cache'})
          with urllib.request.urlopen(request,timeout=25) as response:
              content=response.read()
          if len(content)<1000:
              raise SystemExit(f'Rejected empty or short response: {len(content)} bytes')
          decoded=None
          for encoding in ('utf-8-sig','cp1255'):
              try:
                  candidate=content.decode(encoding)
                  if 'שם ישוב' in candidate.splitlines()[0]:
                      decoded=candidate
                      break
              except UnicodeError:
                  pass
          if decoded is None:
              raise SystemExit('Rejected: CSV header missing')
          rows=list(csv.DictReader(io.StringIO(decoded)))
          if not rows or not {'מצביעים','כשרים','שם ישוב'}.issubset(rows[0]):
              raise SystemExit('Rejected: missing rows/columns')
          voters=sum(int(r['מצביעים']) for r in rows)
          valid=sum(int(r['כשרים']) for r in rows)
          if voters<=0 or valid<=0 or valid>voters:
              raise SystemExit('Rejected: invalid totals')
          path=pathlib.Path('public/data/expc.csv')
          path.parent.mkdir(parents=True,exist_ok=True)
          if not path.exists() or path.read_bytes()!=content:
              path.write_bytes(content)
              print(f'Changed: {len(rows)} localities, {voters} voters, {valid} valid votes')
          else:
              print('No change')
          PY
      - name: Commit only when data changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/data/expc.csv && [ -z "$(git ls-files --others --exclude-standard public/data/expc.csv)" ]; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/expc.csv
          git commit -m 'Update election results CSV'
          git push
